# =============================================================================
# ETL Orchestration Framework — pyproject.toml
# =============================================================================
# A reusable Python-based ETL workflow orchestration framework providing
# workflow/DAG definitions, task dependencies, scheduling, retries, failure
# handling, state persistence, execution history, concurrency, and hooks.
# =============================================================================

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "etl-orchestration-framework"
version = "0.1.0"
description = "A reusable Python ETL workflow orchestration framework with DAGs, scheduling, retries, state persistence, and execution history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "JayantVerman", email = "speedpost029@gmail.com" },
]
keywords = [
    "data-engineering",
    "etl",
    "orchestration",
    "workflow",
    "dag",
    "scheduler",
    "retries",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
]

[project.optional-dependencies]
# Development / testing / quality tools
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0,<7",
    "ruff>=0.1.0,<1",
    "mypy>=1.0,<3",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://example.com/etl-orchestration-framework"
Repository = "https://example.com/etl-orchestration-framework"

[project.scripts]
orchestrator = "etl_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_orchestrator"]

# =============================================================================
# Tool: Ruff (linting, formatting, import sorting)
# =============================================================================
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line-too-long (handled by formatter)
    "B008",     # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["etl_orchestrator"]

# =============================================================================
# Tool: mypy (static type checking)
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src/etl_orchestrator", "tests"]
exclude = ["\\.venv", "build", "dist"]

# PyYAML is used from Milestone 7 (YAML workflow configuration) onward.
# Re-add a [[tool.mypy.overrides]] section with module = "yaml.*" and
# ignore_missing_imports = true if mypy reports missing imports for yaml.

# =============================================================================
# Tool: pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["etl_orchestrator"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
