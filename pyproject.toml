[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etl-orchestrator"
version = "0.1.0"
description = "A small, self-contained ETL orchestration framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jayant Verma", email = "speedpost029@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
orchestrator = "etl_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
